<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <button id="menu-button">☰</button>
    <h1 class="header-text">TaskMan</h1>
</header>

<div id="menu-panel">
    <p>ユーザー名: <span id="username-display"></span></p>
    <button id="logout-button">ログアウト</button>
    <button id="close-menu-button">閉じる</button>
</div>

<div id="app-display">
    <div id="calendar-display">
        <div id="calendar-text-display">
            <button id="prev-month">←</button>
            <button id="next-month">→</button>
            <div id="date"></div>
        </div>
        <div id="calendar-header">
            <div class="sun">日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div class="sat">土</div>
        </div>
        <div id="calendar"></div>
    </div>

    <div id="displaying">
        <div id="top-priority-display">
            <h2>最優先タスク</h2>

            <div id="top-priority-list"></div>
        </div>
        <h2>課題一覧</h2>
        <ul id="task-list">
        </ul>
        <div>
            <button id="add-button" type="button">課題を追加</button>
        </div>

        <h2>達成済課題</h2>
        <ul id="end-list"> 
        </ul>
    </div>
</div>

<div id="add-task-display">
    <div id="add-task-text">
        <p class="assignment-p">|課題名</p>
        <p class="deadline-p">|締め切り</p>
        <p class="importance-p">|優先度</p>
    </div>
    <form id="add-task-form">
        <input type="text" id="title" placeholder="タイトル">
        <input type="date" id="deadline" placeholder="締め切り">

        <select id="importance">
            <option value="3">高</option>
            <option value="2">中</option>
            <option value="1">低</option>
        </select>
        <button type="submit" id="add-task-button">追加</button>
    </form>

    <hr>

    <div id="add-regular-task-section">
        <h3>定期タスク追加</h3>
        <label>
            <input type="checkbox" id="regular-task-add"> 定期タスクを追加
        </label>
        
        <div id="regular-task-options" style="display: none;">
            課題名:<input id="regular-task-title" type="text" placeholder="タイトル">
            <label>曜日を選択:</label>
            <div id="days-selector">
                <label><input type="checkbox" class="day-checkbox" value="0"> 日</label>
                <label><input type="checkbox" class="day-checkbox" value="1"> 月</label>
                <label><input type="checkbox" class="day-checkbox" value="2"> 火</label>
                <label><input type="checkbox" class="day-checkbox" value="3"> 水</label>
                <label><input type="checkbox" class="day-checkbox" value="4"> 木</label>
                <label><input type="checkbox" class="day-checkbox" value="5"> 金</label>
                <label><input type="checkbox" class="day-checkbox" value="6"> 土</label>
                <label><input type="checkbox" id="select-all-days"> すべて</label>
            </div>

            <div>
                <label>開始日:</label>
                <input type="date" id="regular-start-date" required>
            </div>

            <div>
                <label>終了日:</label>
                <input type="date" id="regular-end-date" required>
            </div>

            <button type="button" id="regular-add-button">定期タスクを追加</button>
        </div>
    </div>
</div>


<div id="edit-task-display">
    <div id="edit-task-text">
        <p class="assignment-p">|課題名</p>
        <p class="deadline-p">|締め切り</p>
        <p class="importance-p">|優先度</p>
    </div>
        
     <form id="edit-task-form">
        <input type="text" id="edit-title" placeholder="タイトル">
        <input type="date" id="edit-deadline" placeholder="締め切り">

        <select id="edit-importance">
            <option value="3">高</option>
            <option value="2">中</option>
            <option value="1">低</option>
        </select>
        <button type="submit" id="edit-task-button">編集を確定</button>
        <button type="button" id="edit-cancel-button">キャンセル</button>
        <button type="button" id="delete-task-button">削除</button>
        <button type="button" id="complete-task-button">完了</button>
    </form>
</div>

<div id="login-display">
    <form id="login-form">
        ユーザー名:<input id="login-username" autocomplete="username">
        パスワード:<input id="login-password" type="password"  autocomplete="current-password">
        <button id="login-button" type="submit">
            ログイン
        </button>
        <button id="register-display-button" type="button">
            新規登録へ
        </button>
    </form>
</div>

<div id="register-display">
    <form id="register-form">
        ユーザー名を入力<input id="register-username" autocomplete="username">
        パスワードを入力<input id="register-password" type="password" autocomplete="new-password">
        <button id="register-button" type="submit">
            新規登録
        </button>
        <button id="register-back-button" type="button">
            ログイン画面に戻る
        </button>
    </form>
</div>

<script type="module" src="main.ts"></script>
</body>
</html>
